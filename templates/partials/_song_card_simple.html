<div class="song-card" data-id="{{ cancion.id }}">
  <div class="song-meta">
    <div class="song-cover">🎵</div>
    <div>
      <div class="song-title">{{ cancion.titulo }}</div>
      <div class="song-artist">{{ cancion.artista }}</div>
      <div class="song-tags">
        <span class="tag tag-genre">{{ cancion.genero }}</span>
      </div>
    </div>
  </div>
  <div class="song-actions">
    <span class="song-rating">★ {{ "%.1f"|format(cancion.calificacion) }}</span>
    <span class="song-duration">{{ cancion.duracion }}</span>
    <button class="btn-icon btn-play-song" title="Reproducir"
      onclick="playSong('{{ cancion.titulo|replace("'", "\\'") }}','{{ cancion.artista|replace("'", "\\'") }}')">▶</button>
    <button class="btn-icon btn-like" title="Me gusta"
      onclick="reaccion('{{ cancion.id }}','like',this)">♥</button>
    <button class="btn-icon btn-dislike" title="No me gusta"
      onclick="reaccion('{{ cancion.id }}','dislike',this)">✕</button>
  </div>
</div>
