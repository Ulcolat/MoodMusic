<div class="song-card" data-id="{{ c.id }}">
  <div class="song-meta">
    <div class="song-cover">🎵</div>
    <div>
      <div class="song-title">{{ c.titulo }}</div>
      <div class="song-artist">{{ c.artista }}</div>
      <div class="song-tags">
        <span class="tag tag-genre">{{ c.genero }}</span>
        <span class="tag tag-mood">{{ c.animo }}</span>
        <span class="tag tag-ctx">{{ c.contexto }}</span>
      </div>
    </div>
  </div>
  <div class="song-actions">
    <span class="song-rating">★ {{ "%.1f"|format(c.calificacion) }}</span>
    <span class="song-duration">{{ c.duracion }}</span>
    <button class="btn-icon btn-play-song" title="Reproducir"
      onclick="playSong('{{ c.titulo|replace("'", "\\'") }}','{{ c.artista|replace("'", "\\'") }}')">▶</button>
    <button class="btn-icon btn-like" title="Me gusta"
      onclick="reaccion('{{ c.id }}','like',this)">♥</button>
    <button class="btn-icon btn-dislike" title="No me gusta"
      onclick="reaccion('{{ c.id }}','dislike',this)">✕</button>
  </div>
</div>
